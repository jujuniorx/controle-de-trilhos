name: resolver-migracao
on:
  workflow_dispatch:
jobs:
  resolver:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: marcar migracao falha como aplicada (colunas ja existem em producao)
        continue-on-error: true
        run: npx prisma migrate resolve --applied 20261026080000_trilheiro_partida_local
      - name: marcar migracao estoque TLS malha como aplicada (tabela ja existe em producao)
        continue-on-error: true
        run: npx prisma migrate resolve --applied 20261028120000_estoque_tls_malha
      - name: aplicar migracoes pendentes
        run: npx prisma migrate deploy
