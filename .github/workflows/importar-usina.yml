name: importar-usina
on:
  workflow_dispatch:
  push:
    branches: [ci-diag5]
    paths: ['.github/workflows/importar-usina.yml', 'scripts/importar-serra.ts', 'scripts/dados/serra-recebidos.json']
jobs:
  importar:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - name: migrar
        run: npx prisma migrate deploy
      - name: importar outubro/2026
        run: npx tsx scripts/importar-usina-outubro.ts
# Rodada de 2026-10-16: aplica migrações pendentes (descarregada) e reexecuta a importação (idempotente).
# Rodada de 2026-10-16-1135: aplica a migração de ordem dos caminhões (ADD COLUMN IF NOT EXISTS) e reexecuta a importação.
      - name: importar recebidos da serra (sem repetir NF)
        run: npx tsx scripts/importar-serra.ts
