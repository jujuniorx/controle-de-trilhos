name: diagnostico-serra
on:
  push:
    branches: [diag-serra]
    paths: ['scripts/diagnostico-serra.ts', '.github/workflows/diagnostico-serra.yml']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsx scripts/diagnostico-serra.ts
      - name: gravar resultado na branch
        run: |
          git config user.name "diag-bot"
          git config user.email "diag-bot@users.noreply.github.com"
          git add diagnostico-serra.json
          git commit -m "diagnóstico da serra [skip ci]"
          git push origin HEAD:diag-serra
